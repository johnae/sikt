[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnae/sikt"
homepage = "https://github.com/johnae/sikt"

[workspace.dependencies]
sikt = { path = "crates/sikt", version = "0.1.0" }

# Release binaries: as fast and small as the compiler makes them.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
