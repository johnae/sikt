[package]
name = "sikt-cli"
description = "Command-line search and replace with sikt patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["grep", "sed", "search", "replace", "regex"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "sikt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
memchr = "2.8.3"
memmap2 = "0.9.11"
miette = { version = "7.6.0", features = ["fancy"] }
mimalloc = { version = "0.1.52", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sikt.workspace = true
similar = "3.2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
