[package]
name = "sikt-cli"
description = "Command-line search and replace with sikt patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sikt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
memchr = "2.8.3"
memmap2 = "0.9.11"
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sikt.workspace = true
similar = "3.2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
