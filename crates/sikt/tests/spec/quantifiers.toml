[[case]]
name = "exact count"
pattern = '3 digit'
input = "12 12345"
matches = ["123"]

[[case]]
name = "one or more"
pattern = '1+ digit'
input = "a12b3"
matches = ["12", "3"]

[[case]]
name = "zero or more"
pattern = '"a" 0+ "b"'
input = "a ab abbb"
matches = ["a", "ab", "abbb"]

[[case]]
name = "at least n"
pattern = '2+ digit'
input = "1 12 123"
matches = ["12", "123"]

[[case]]
name = "range"
pattern = '2..3 digit'
input = "1 12 1234"
matches = ["12", "123"]

[[case]]
name = "optional"
pattern = '"colo" optional "u" "r"'
input = "color colour"
matches = ["color", "colour"]

[[case]]
name = "repetition of a group"
pattern = '1+ ("ab" or "c")'
input = "abcab x cc"
matches = ["abcab", "cc"]

[[case]]
name = "possessive repetition never gives back"
pattern = '0+ any "x"'
input = "abx"
matches = []

[[case]]
name = "possessive class repetition"
pattern = '1+ digit digit'
input = "123"
matches = []

[[case]]
name = "possessive range"
pattern = '1..3 "a" "a"'
input = "aaa aaaa"
matches = ["aaaa"]
