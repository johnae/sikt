# Typed captures: `integer` and `number` match numbers and give their captures
# a value. `values` checks those values; text stays available as before.

[[case]]
name = "integer"
pattern = 'n: integer'
input = "a 12 -3 +4 5x"
matches = [
  { text = "12", values = { n = 12 } },
  { text = "-3", values = { n = -3 } },
  { text = "+4", values = { n = 4 } },
  { text = "5", values = { n = 5 } },
]

[[case]]
name = "number"
pattern = 'x: number'
input = "1.5 -0.25 .5 7 1."
matches = [
  { text = "1.5", values = { x = 1.5 } },
  { text = "-0.25", values = { x = -0.25 } },
  { text = ".5", values = { x = 0.5 } },
  { text = "7", values = { x = 7.0 } },
  { text = "1", values = { x = 1.0 } },
]

[[case]]
name = "untyped captures are text"
pattern = 'n: 1+ digit'
input = "12"
matches = [{ text = "12", values = { n = "12" } }]

[[case]]
name = "type through parentheses and rules"
pattern = 'let pid = integer find "pid=" p: (pid)'
input = "pid=42"
matches = [{ text = "pid=42", values = { p = 42 } }]

[[case]]
name = "integer too large becomes a number"
pattern = 'n: integer'
input = "99999999999999999999"
matches = [{ text = "99999999999999999999", values = { n = 1e20 } }]

[[case]]
name = "typed words work without captures"
pattern = 'integer "%"'
input = "50% x%"
matches = ["50%"]

[[case]]
name = "error: a capture with two types"
pattern = '(n: integer) or (n: number)'
error = "capture `n` has two types"

[[case]]
name = "error: integer can't name a rule"
pattern = 'let integer = digit find integer'
error = "`integer` is a built-in word and can't name a rule"

[[case]]
name = "sizes are bytes"
pattern = 's: size'
input = "16G 7.7G 4.0K 512 1.5GiB 2MB 3kB 0B 1T"
matches = [
  { text = "16G", values = { s = 17179869184 } },
  { text = "7.7G", values = { s = 8267812045 } },
  { text = "4.0K", values = { s = 4096 } },
  { text = "512", values = { s = 512 } },
  { text = "1.5GiB", values = { s = 1610612736 } },
  { text = "2MB", values = { s = 2000000 } },
  { text = "3kB", values = { s = 3000 } },
  { text = "0B", values = { s = 0 } },
  { text = "1T", values = { s = 1099511627776 } },
]

[[case]]
name = "percentages are numbers"
pattern = 'p: percent'
input = "48% 1.5% 7"
matches = [{ text = "48%", values = { p = 48.0 } }, { text = "1.5%", values = { p = 1.5 } }]

[[case]]
name = "where compares sizes with units"
program = true
pattern = 'find name: 1+ letter space s: size where s > 1G'
input = "a 2G b 512M c 1.5G d 2000000"
matches = ["a 2G", "c 1.5G"]

[[case]]
name = "where compares typed numbers"
program = true
pattern = 'find p: percent where p >= 50'
input = "48% 50% 99.5%"
matches = ["50%", "99.5%"]

[[case]]
name = "durations are seconds"
pattern = 'd: duration'
input = "1h30m 90s 250ms 2d 1.5h 26:58 00:05:12 1-02:03:04 5min"
matches = [
  { text = "1h30m", values = { d = 5400.0 } },
  { text = "90s", values = { d = 90.0 } },
  { text = "250ms", values = { d = 0.25 } },
  { text = "2d", values = { d = 172800.0 } },
  { text = "1.5h", values = { d = 5400.0 } },
  { text = "26:58", values = { d = 1618.0 } },
  { text = "00:05:12", values = { d = 312.0 } },
  { text = "1-02:03:04", values = { d = 93784.0 } },
]

[[case]]
name = "where compares durations with units"
program = true
pattern = 'find name: 1+ letter " " t: duration where t >= 1m30s'
input = "a 90s b 2m c 45s d 1:29 e 1:31"
matches = ["a 90s", "b 2m", "e 1:31"]

[[case]]
name = "units follow the capture's type"
program = true
pattern = 'find s: size " " t: duration where s > 1m and t > 1m'
input = "2M 2m 1M 2m 2M 30s"
matches = ["2M 2m"]

[[case]]
name = "error: a unit on an untyped capture"
program = true
pattern = 'find n: 1+ digit where n > 5m'
error = "`m` is a unit, but `n` isn't a size or a duration"

[[case]]
name = "error: a unit of the wrong kind"
program = true
pattern = 'find s: size where s > 5h'
error = "`h` isn't a unit of size"
