[package]
name = "sikt"
description = "A readable pattern language for searching, extracting and replacing text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sikt"
readme = "../../README.md"
keywords = ["pattern", "regex", "peg", "parser", "search"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
memchr = "2.8.3"
miette = "7.6.0"
smallvec = { version = "1.16.3", features = ["union"] }
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
libtest-mimic = "0.8.2"
miette = { version = "7.6.0", features = ["fancy"] }
proptest = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[[test]]
name = "spec"
harness = false

[[bench]]
name = "vs_regex"
harness = false
